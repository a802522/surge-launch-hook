name: build-dylib

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang + lld
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld git file

      - name: Fetch iOS SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git sdks
          cd sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          cd ..
          ls sdks/iPhoneOS16.5.sdk | head

      - name: Build arm64 iOS dylib
        run: |
          set -eux
          SDK="$PWD/sdks/iPhoneOS16.5.sdk"
          mkdir -p dist
          clang --version
          clang -target arm64-apple-ios14.0 \
            -isysroot "$SDK" \
            -fobjc-arc -fblocks \
            -dynamiclib \
            -framework Foundation -framework UIKit -lobjc \
            -fuse-ld=lld \
            -o dist/SurgeLaunchHook.dylib SurgeLaunchHook.m
          file dist/SurgeLaunchHook.dylib
          llvm-objdump -p dist/SurgeLaunchHook.dylib | head -60 || true

      - uses: actions/upload-artifact@v4
        with:
          name: SurgeLaunchHook
          path: dist/SurgeLaunchHook.dylib

      - name: Commit dylib back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/SurgeLaunchHook.dylib
          git commit -m "build: SurgeLaunchHook.dylib" || true
          git push origin HEAD:main
